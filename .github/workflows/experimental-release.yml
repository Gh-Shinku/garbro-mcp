name: Experimental release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version without v (for example 0.1.0-experimental.1)'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub prerelease after all smoke tests pass (never publish to npm)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: experimental-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  checks:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/check.yml
    with:
      defer-packages: true

  artifacts:
    needs: checks
    uses: ./.github/workflows/release-artifacts.yml
    with:
      version: ${{ inputs.version }}
      prerelease: true
      artifact-name: experimental-release

  publish:
    needs: artifacts
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: experimental-release
          path: dist/release
      - name: Create a GitHub prerelease at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag="v$RELEASE_VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "Tag $tag already exists; refusing to replace or reuse it."
            exit 1
          fi
          gh release create "$tag" dist/release/garbro-mcp-* \
            --target "$RELEASE_COMMIT" \
            --prerelease \
            --title "garbro-mcp $RELEASE_VERSION (experimental)" \
            --notes "Experimental, not stable. Requires Node.js 24+. Download the portable ZIP; no pnpm, Git, or runtime dependency installation is needed. The optional tgz installs locally with npm. Verify downloads against the attached SHA256SUMS. Tested commit: $RELEASE_COMMIT."
